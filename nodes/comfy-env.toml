[dependencies]
open3d = "*"
av = "*"
# vtk + pyvista stay on conda-forge (NOT PyPI) so VTK's RPATH includes
# $CONDA_PREFIX/lib -- that's what lets VTK dlopen conda's libOSMesa below. A PyPI
# vtk wheel's RPATH points inside the wheel and can't resolve it across prefixes.
vtk = ">=9.3"
pyvista = ">=0.45"
# Headless software OpenGL with no GPU / no X display (CI): VTK dlopens libOSMesa.so
# at runtime for its off-screen OSMesa render window (llvmpipe software GL baked in).
# conda mesalib SHIPS libOSMesa only up to 25.0.5 -- 25.1.9+ and 26.x dropped it
# (Lavapipe/Vulkan only). So pin to the last range that still provides it. The
# wiring (force the OSMesa window) lives in nodes/utils/headless_gl.py.
mesalib = ">=24.3,<25.1"

[cuda]
packages = ["cc_torch"]

[pypi-dependencies]
safetensors = ">=0.4.0"
psutil = "*"
einops = "*"
comfy-aimdo = "*"
# PanoPack's direct imports.
pillow = "*"
opencv-python-headless = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
scikit-image = "*"
tqdm = "*"
trimesh = ">=4.0"
rtree = "*"     # trimesh ray intersect / bounds_tree -> import rtree
plyfile = "*"
imageio = { version = "*", extras = ["ffmpeg"] }
loguru = "*"
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3fab839f0be9931dac7c8488eb0e1600c236e183" }
pyyaml = "*"
transformers = "*"
sqlalchemy = "*"
pydantic = "*"