[dependencies]
open3d = "*"
av = "*"
vtk = ">=9.3"
pyvista = ">=0.45"
# Headless software GL stack (no GPU, no X display on CI):
#   mesalib  - Mesa: llvmpipe software rasterizer + the EGL vendor (libEGL_mesa).
#   libglvnd - the GLVND dispatcher (libEGL.so.1) that VTK loads and that reads
#              __EGL_VENDOR_LIBRARY_DIRS to discover Mesa's vendor.
# With the vendor discoverable, Mesa's software EGL device becomes enumerable so
# VTK's vtkEGLRenderWindow can initialize. The wiring lives in
# nodes/utils/headless_gl.py (called before every pv.Plotter).
mesalib = "*"
libglvnd = "*"

[pypi-dependencies]
safetensors = ">=0.4.0"
psutil = "*"
einops = "*"
comfy-aimdo = "*"
# PanoPack's direct imports.
pillow = "*"
opencv-python-headless = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
scikit-image = "*"
tqdm = "*"
trimesh = ">=4.0"
rtree = "*"     # trimesh ray intersect / bounds_tree -> import rtree
plyfile = "*"
imageio = { version = "*", extras = ["ffmpeg"] }
loguru = "*"
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3fab839f0be9931dac7c8488eb0e1600c236e183" }
pyyaml = "*"
transformers = "*"
sqlalchemy = "*"
pydantic = "*"