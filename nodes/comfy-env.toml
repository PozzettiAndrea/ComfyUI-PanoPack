[dependencies]
open3d = "*"
av = "*"
# vtk + pyvista come from conda-forge (NOT PyPI) so VTK, Mesa and libglvnd all
# live in one prefix that's wired for headless EGL. The PyPI vtk wheel cannot
# load conda's libEGL (GLVND vendor discovery fails across the prefix boundary),
# so off-screen rendering crashed on the GPU-less CI runner. mesalib supplies
# libEGL + the llvmpipe software rasterizer; VTK 9.4+ auto-falls-back
# GLX -> EGL -> llvmpipe. Env vars steering it live in nodes/utils/headless_gl.py.
vtk = ">=9.3"
pyvista = ">=0.45"
mesalib = "*"

[pypi-dependencies]
safetensors = ">=0.4.0"
psutil = "*"
einops = "*"
comfy-aimdo = "*"
# PanoPack's direct imports.
pillow = "*"
opencv-python-headless = "*"
numpy = "*"
scipy = "*"
matplotlib = "*"
scikit-image = "*"
tqdm = "*"
trimesh = ">=4.0"
rtree = "*"     # trimesh ray intersect / bounds_tree -> import rtree
plyfile = "*"
imageio = { version = "*", extras = ["ffmpeg"] }
loguru = "*"
# pyvista + vtk moved to conda [dependencies] above (headless EGL needs the conda GL stack).
utils3d = { git = "https://github.com/EasternJournalist/utils3d.git", rev = "3fab839f0be9931dac7c8488eb0e1600c236e183" }
# torch-ransac3d intentionally NOT declared: its 2.0.0 py3-none-any wheel ships an
# archive member named `tests/*`, an illegal filename on Windows (os error 123 /
# ERROR_INVALID_NAME) that aborts the whole pixi install. The one function we use
# (plane_fit) is pure torch with no compiled extension, so it's vendored at
# nodes/_vendor/torch_ransac3d_plane.py -- GPU RANSAC works on all platforms with
# no dependency on the broken wheel. See that file's header for details.
pyyaml = "*"
transformers = "*"
sqlalchemy = "*"
pydantic = "*"